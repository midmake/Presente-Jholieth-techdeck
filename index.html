<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064b38">
<title>Lembrança do nosso primeiro rolê de skate</title>
<style>
:root{--g1:#032f25;--g2:#075842;--g3:#0a7657;--text:#f8fff9;--muted:rgba(248,255,249,.72);--line:rgba(255,255,255,.13);--glass:rgba(255,255,255,.085);--shadow:0 24px 60px rgba(0,20,14,.24)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:radial-gradient(850px 520px at 10% -8%,rgba(118,230,187,.16),transparent 62%),radial-gradient(900px 620px at 100% 30%,rgba(255,255,255,.07),transparent 58%),linear-gradient(145deg,var(--g1),var(--g2) 52%,var(--g3));overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:repeating-radial-gradient(circle at 0 0,rgba(255,255,255,.028) 0 1px,transparent 1px 4px),repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 1px,transparent 1px 8px);mix-blend-mode:soft-light}button{font:inherit}
#gate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(700px 480px at 50% 32%,rgba(59,191,142,.18),transparent 66%),linear-gradient(150deg,#032c22,#064735 58%,#086247);transition:.5s ease}#gate.hide{opacity:0;visibility:hidden}.gate-inner{width:min(420px,100%)}.gate-title{margin:0 0 24px;font-size:clamp(2.25rem,10vw,3.6rem);line-height:.98;letter-spacing:-.04em}.enter{display:grid;place-items:center;margin:auto;width:98px;height:98px;border:1px solid rgba(255,255,255,.15);border-radius:26px;background:rgba(255,255,255,.10);color:#fff;box-shadow:var(--shadow);backdrop-filter:blur(12px);cursor:pointer}.enter .emoji{font-size:3rem;transition:transform .7s cubic-bezier(.2,.8,.2,1)}.enter.flip .emoji{transform:rotate(360deg) translateY(-4px)}.gate-note{margin:15px 0 0;font-size:.82rem;color:rgba(255,255,255,.62)}
main{position:relative;z-index:1;width:min(1000px,calc(100% - 24px));margin:0 auto;padding:20px 0 46px}.hero{padding:clamp(28px,5vw,54px);border:1px solid var(--line);border-radius:32px;background:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.045));box-shadow:var(--shadow);backdrop-filter:blur(14px)}.hero h1{margin:0;max-width:12ch;font-size:clamp(2.8rem,8vw,5.6rem);line-height:.92;letter-spacing:-.055em}.hero p{margin:16px 0 0;color:var(--muted);font-size:.82rem;letter-spacing:.03em}.media-block{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:28px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(12px)}.videos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.videos video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:20px;background:#02150f;border:1px solid rgba(255,255,255,.10)}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photos img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:20px;border:1px solid rgba(255,255,255,.10);box-shadow:0 16px 32px rgba(0,0,0,.15)}.quote{margin-top:18px;padding:clamp(30px,7vw,62px);border-radius:30px;background:#f3f0e7;color:#12372a;box-shadow:var(--shadow);text-align:center}.quote p{margin:0 auto;max-width:24ch;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,5vw,3.6rem);line-height:1.08}.quote span{color:#0a6b4d}
@media(max-width:700px){main{width:min(100% - 18px,1000px);padding-top:9px}.hero{padding:28px 22px;border-radius:28px}.hero h1{font-size:clamp(2.7rem,13vw,4.2rem)}.media-block{padding:14px;border-radius:24px}.videos{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:74vw;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.videos::-webkit-scrollbar{display:none}.videos video{scroll-snap-align:center}.photos{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.photos img{border-radius:17px}.quote{padding:36px 22px;border-radius:26px}}
</style>
</head>
<body>
<section id="gate"><div class="gate-inner"><h1 class="gate-title">Toque no skate<br>para entrar</h1><button id="enter" class="enter" aria-label="Entrar"><span class="emoji">🛹</span></button><p class="gate-note">toque para descobrir</p></div></section>
<main id="content" hidden>
<section class="hero"><h1>Lembrança do nosso primeiro rolê de skate</h1><p>Aqui guardaremos os próximos.</p></section>
<section class="media-block"><div class="videos"><video controls playsinline preload="metadata" poster="poster-1.jpg" src="6A0E6684-5A14-46E8-95F6-66C1EBAA6FAE.mp4"></video><video controls playsinline preload="metadata" poster="poster-2.jpg" src="9BD1EAC5-94F1-4024-BC7E-B3E0AF7C0608.mp4"></video><video controls playsinline preload="metadata" poster="poster-3.jpg" src="B97755E8-2E66-44EB-BAAC-747C646868C9.mov"></video></div></section>
<section class="media-block"><div class="photos"><img src="IMG_9686.jpeg" alt="Foto nossa naquele dia"><img src="IMG_9687.jpeg" alt="Foto nossa naquele dia"></div></section>
<section class="quote"><p><strong>Cada momento contigo se vuelve más especial.</strong><br><span>Y ojalá todavía nos queden muchos por compartir.</span></p></section>
</main>
<script>
const gate=document.getElementById('gate'),content=document.getElementById('content'),enter=document.getElementById('enter');enter.addEventListener('click',()=>{enter.classList.add('flip');setTimeout(()=>{content.hidden=false;gate.classList.add('hide');window.scrollTo(0,0)},520)},{once:true});
</script>
</body>
</html>
